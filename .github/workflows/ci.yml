name: ci

# Enterprise CI gate for egl-util-cpp, generated by EADOS and completed in Milestone 1.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test commands drive CMakePresets.json; format and lint are
# pinned to a fixed clang-tooling version for reproducibility.
#
# CI execution tiers (AGENTS.md §10) — to stay within the private-repo GitHub Actions
# budget, the *build matrix* is tiered by event; every non-build gate (format, tidy,
# consistency, sanitizers, valgrind, docs, benchmark) runs on every event, unchanged:
#
#   * pull_request  -> the "pr" tier: the full Linux set (gcc/clang, debug+release, plus
#                      ASan/UBSan) and one Windows/MSVC debug build. This is the fast,
#                      cheap (1x/2x-cost) feedback loop for day-to-day PR iteration.
#   * push to main  -> the "full" tier: the complete matrix, adding the 10x-billed macOS
#     & schedule      (Apple Clang, debug+release) and the Windows release cell. Runs on
#     & dispatch       every merge to main and nightly, so nothing lands on main without
#                      the entire cross-platform matrix having gone green — the coverage is
#                      preserved, only shifted off the per-push PR loop. Trigger it manually
#                      on a branch with the "Run workflow" button (workflow_dispatch) to get
#                      a full cross-platform run before merging when a change is risky.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *" # nightly full-matrix backstop, 06:00 UTC
  workflow_dispatch: # on-demand full-matrix run (e.g. before merging a risky PR)
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on main (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned for reproducibility. clang-format and clang-tidy are released as separate PyPI
  # packages whose patch versions do not line up, so they are pinned independently.
  CLANG_FORMAT_VERSION: "22.1.5"
  CLANG_TIDY_VERSION: "22.1.7"

jobs:
  # ---------------------------------------------------------------------------
  # Pick the build matrix for this event: the cheap "pr" subset on pull_request,
  # the full cross-platform matrix everywhere else (push to main, nightly, dispatch,
  # reusable-workflow calls). See the CI execution tiers note at the top of this file.
  # ---------------------------------------------------------------------------
  setup:
    name: setup / select build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      tier: ${{ steps.select.outputs.tier }}
    steps:
      - name: Select the matrix
        id: select
        shell: bash
        run: |
          pr='{"include":[{"os":"ubuntu-24.04","toolchain":"gcc","preset":"debug","cc":"gcc","cxx":"g++"},{"os":"ubuntu-24.04","toolchain":"gcc","preset":"release","cc":"gcc","cxx":"g++"},{"os":"ubuntu-24.04","toolchain":"gcc","preset":"asan","cc":"gcc","cxx":"g++"},{"os":"ubuntu-24.04","toolchain":"gcc","preset":"ubsan","cc":"gcc","cxx":"g++"},{"os":"ubuntu-24.04","toolchain":"clang","preset":"debug","cc":"clang","cxx":"clang++"},{"os":"ubuntu-24.04","toolchain":"clang","preset":"release","cc":"clang","cxx":"clang++"},{"os":"windows-2022","toolchain":"msvc","preset":"debug","cc":"cl","cxx":"cl"}]}'
          full='{"include":[{"os":"ubuntu-24.04","toolchain":"gcc","preset":"debug","cc":"gcc","cxx":"g++"},{"os":"ubuntu-24.04","toolchain":"gcc","preset":"release","cc":"gcc","cxx":"g++"},{"os":"ubuntu-24.04","toolchain":"gcc","preset":"asan","cc":"gcc","cxx":"g++"},{"os":"ubuntu-24.04","toolchain":"gcc","preset":"ubsan","cc":"gcc","cxx":"g++"},{"os":"ubuntu-24.04","toolchain":"clang","preset":"debug","cc":"clang","cxx":"clang++"},{"os":"ubuntu-24.04","toolchain":"clang","preset":"release","cc":"clang","cxx":"clang++"},{"os":"windows-2022","toolchain":"msvc","preset":"debug","cc":"cl","cxx":"cl"},{"os":"windows-2022","toolchain":"msvc","preset":"release","cc":"cl","cxx":"cl"},{"os":"macos-14","toolchain":"apple-clang","preset":"debug","cc":"clang","cxx":"clang++"},{"os":"macos-14","toolchain":"apple-clang","preset":"release","cc":"clang","cxx":"clang++"}]}'
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "matrix=$pr" >> "$GITHUB_OUTPUT"
            echo "tier=pr" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$full" >> "$GITHUB_OUTPUT"
            echo "tier=full" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile), tiered by `setup`.
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    needs: setup
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out the source tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install a recent CMake and Ninja
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3
      - name: Set up MSVC environment
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  format:
    name: format / clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned clang-format
        run: pip install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Verify all C/C++ sources are clean
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.c')
          [[ ${#files[@]} -eq 0 ]] && exit 0
          clang-format --dry-run --Werror "${files[@]}"
  tidy:
    name: tidy / clang-tidy diff gate
    runs-on: ubuntu-24.04
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with: { fetch-depth: 0 }
      - uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned clang-tidy
        run: pip install "clang-tidy==${CLANG_TIDY_VERSION}"
      - name: Configure debug to produce compile_commands.json
        run: cmake --preset debug
      - name: clang-tidy the diff
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git diff --name-only --diff-filter=AM "$base"...HEAD -- '*.cpp' > changed.txt || true
          [[ -s changed.txt ]] || exit 0
          mapfile -t f < changed.txt
          clang-tidy -p build/debug --warnings-as-errors='*' "${f[@]}"
  valgrind:
    name: valgrind / leak-check=full
    runs-on: ubuntu-24.04
    env: { CC: gcc, CXX: g++ }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Configure + build the debug test binary
        run: cmake --preset debug && cmake --build --preset debug
      - name: Run the demonstrative test under Valgrind
        run: |
          valgrind --leak-check=full --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,indirect --error-exitcode=1 \
            ./build/debug/util_tests

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  benchmark:
    name: benchmark / reproducible perf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: { CC: gcc, CXX: g++ }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install a recent CMake and Ninja
        uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3
      - name: Build the benchmark suite
        shell: bash
        run: cmake --preset bench && cmake --build --preset bench

  # API documentation gate — the Doxygen `docs` target must build.
  docs:
    name: docs / doxygen build
    runs-on: ubuntu-24.04
    env: { CC: gcc, CXX: g++ }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Configure + build the docs target
        shell: bash
        run: cmake --preset debug && cmake --build --preset debug --target docs

  # Data-race / concurrency gate — runs only when the project exposes concurrency.
  tsan:
    name: tsan / thread sanitizer
    runs-on: ubuntu-24.04
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: lukka/get-cmake@591817e96fcad43505fb4eae36172462abb3a42e # v4.3.3
      - name: Build + test under ThreadSanitizer
        run: cmake --preset tsan && cmake --build --preset tsan && ctest --preset tsan --output-on-failure
