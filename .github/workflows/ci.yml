name: ci

# Enterprise CI gate for egl-util-cpp, generated by EADOS.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test/format/lint commands come from project.yaml; the
# setup steps and language-specific extra jobs come from the profile.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on main (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: gcc, preset: debug }
          - { os: ubuntu-24.04, toolchain: gcc, preset: release }
          - { os: ubuntu-24.04, toolchain: gcc, preset: asan }
          - { os: ubuntu-24.04, toolchain: gcc, preset: ubsan }
          - { os: ubuntu-24.04, toolchain: clang, preset: debug }
          - { os: ubuntu-24.04, toolchain: clang, preset: release }
          - { os: windows-2022, toolchain: msvc, preset: debug }
          - { os: windows-2022, toolchain: msvc, preset: release }
          - { os: macos-14, toolchain: apple-clang, preset: debug }
          - { os: macos-14, toolchain: apple-clang, preset: release }
    steps:
      - name: Check out the source tree
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install a recent CMake and Ninja
        uses: lukka/get-cmake@e0566b3900d662ef5b1dc36fb560c4d2b1b6d6bd # v4.3.3
      - name: Set up MSVC environment
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: bash
        run: cmake --build --preset debug

      - name: Test
        shell: bash
        run: ctest --preset debug --output-on-failure

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  format:
    name: format / clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Verify all C/C++ sources are clean
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.c')
          [[ ${#files[@]} -eq 0 ]] && exit 0
          clang-format --dry-run --Werror "${files[@]}"
  tidy:
    name: tidy / clang-tidy diff gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - uses: lukka/get-cmake@e0566b3900d662ef5b1dc36fb560c4d2b1b6d6bd # v4.3.3
      - name: Configure debug to produce compile_commands.json
        env: { CC: clang, CXX: clang++ }
        run: cmake --preset debug
      - name: clang-tidy the diff
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git diff --name-only --diff-filter=AM "$base"...HEAD -- '*.cpp' '*.hpp' '*.h' > changed.txt || true
          [[ -s changed.txt ]] || exit 0
          mapfile -t f < changed.txt
          clang-tidy -p build/debug --warnings-as-errors='*' "${f[@]}"
  valgrind:
    name: valgrind / leak-check=full
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Run the demonstrative test under Valgrind
        run: |
          valgrind --leak-check=full --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,indirect --error-exitcode=1 \
            ./build/debug/util_tests

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  benchmark:
    name: benchmark / reproducible perf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install a recent CMake and Ninja
        uses: lukka/get-cmake@e0566b3900d662ef5b1dc36fb560c4d2b1b6d6bd # v4.3.3
      - name: Set up MSVC environment
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Run the benchmark suite
        shell: bash
        run: cmake --build --preset bench


  # Data-race / concurrency gate — runs only when the project exposes concurrency.
  tsan:
    name: tsan / thread sanitizer
    runs-on: ubuntu-24.04
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@v6
      - uses: lukka/get-cmake@e0566b3900d662ef5b1dc36fb560c4d2b1b6d6bd # v4.3.3
      - name: Build + test under ThreadSanitizer
        run: cmake --preset tsan && cmake --build --preset tsan && ctest --preset tsan --output-on-failure

