name: ci

# Enterprise CI gate for egl-util-cpp, generated by EADOS and completed in Milestone 1.
# Implements the quality bar in AGENTS.md §10 across the toolchain matrix from the
# language profile. The build/test commands drive CMakePresets.json; format and lint are
# pinned to a fixed clang-tooling version for reproducibility.

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on a PR; never cancel a run on main (its history matters).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Pinned for reproducibility. clang-format and clang-tidy are released as separate PyPI
  # packages whose patch versions do not line up, so they are pinned independently.
  CLANG_FORMAT_VERSION: "22.1.5"
  CLANG_TIDY_VERSION: "22.1.7"

jobs:
  # ---------------------------------------------------------------------------
  # Cross-platform build + test matrix (from the language profile).
  # ---------------------------------------------------------------------------
  build:
    name: build / ${{ matrix.os }} / ${{ matrix.toolchain }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, toolchain: gcc, preset: debug, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, toolchain: gcc, preset: release, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, toolchain: gcc, preset: asan, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, toolchain: gcc, preset: ubsan, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, toolchain: clang, preset: debug, cc: clang, cxx: clang++ }
          - { os: ubuntu-24.04, toolchain: clang, preset: release, cc: clang, cxx: clang++ }
          - { os: windows-2022, toolchain: msvc, preset: debug, cc: cl, cxx: cl }
          - { os: windows-2022, toolchain: msvc, preset: release, cc: cl, cxx: cl }
          - { os: macos-14, toolchain: apple-clang, preset: debug, cc: clang, cxx: clang++ }
          - { os: macos-14, toolchain: apple-clang, preset: release, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Check out the source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install a recent CMake and Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      - name: Set up MSVC environment
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        shell: bash
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        shell: bash
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  # ---------------------------------------------------------------------------
  # Cross-artifact congruence — the agent-runnable consistency lint.
  # ---------------------------------------------------------------------------
  consistency:
    name: consistency / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # i18n/version checks need full history
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Run the consistency lint
        run: python tools/consistency_lint.py

  # ---------------------------------------------------------------------------
  # Language-specific quality jobs (format, lint, sanitizers, …) from the profile.
  # ---------------------------------------------------------------------------
  format:
    name: format / clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned clang-format
        run: pip install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Verify all C/C++ sources are clean
        shell: bash
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.hpp' '*.h' '*.c')
          [[ ${#files[@]} -eq 0 ]] && exit 0
          clang-format --dry-run --Werror "${files[@]}"
  tidy:
    name: tidy / clang-tidy diff gate
    runs-on: ubuntu-24.04
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install pinned clang-tidy
        run: pip install "clang-tidy==${CLANG_TIDY_VERSION}"
      - name: Configure debug to produce compile_commands.json
        run: cmake --preset debug
      - name: clang-tidy the diff
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          git diff --name-only --diff-filter=AM "$base"...HEAD -- '*.cpp' > changed.txt || true
          [[ -s changed.txt ]] || exit 0
          mapfile -t f < changed.txt
          clang-tidy -p build/debug --warnings-as-errors='*' "${f[@]}"
  valgrind:
    name: valgrind / leak-check=full
    runs-on: ubuntu-24.04
    env: { CC: gcc, CXX: g++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Configure + build the debug test binary
        run: cmake --preset debug && cmake --build --preset debug
      - name: Run the demonstrative test under Valgrind
        run: |
          valgrind --leak-check=full --show-leak-kinds=all \
            --errors-for-leak-kinds=definite,indirect --error-exitcode=1 \
            ./build/debug/util_tests

  # Reproducible performance gate — runs only when the project has a benchmark suite.
  benchmark:
    name: benchmark / reproducible perf
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env: { CC: gcc, CXX: g++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install a recent CMake and Ninja
        uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      - name: Build the benchmark suite
        shell: bash
        run: cmake --preset bench && cmake --build --preset bench

  # API documentation gate — the Doxygen `docs` target must build.
  docs:
    name: docs / doxygen build
    runs-on: ubuntu-24.04
    env: { CC: gcc, CXX: g++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      - run: sudo apt-get update && sudo apt-get install -y doxygen graphviz
      - name: Configure + build the docs target
        shell: bash
        run: cmake --preset debug && cmake --build --preset debug --target docs

  # Data-race / concurrency gate — runs only when the project exposes concurrency.
  tsan:
    name: tsan / thread sanitizer
    runs-on: ubuntu-24.04
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      - name: Build + test under ThreadSanitizer
        run: cmake --preset tsan && cmake --build --preset tsan && ctest --preset tsan --output-on-failure

  # Security fuzzing smoke — libFuzzer harnesses for the untrusted-input components must build
  # and survive a short, bounded run under ASan/UBSan (roadmap 11.5, ADR-0031). Deeper campaigns
  # run out-of-band; this gate catches crashers on every PR while staying minutes-cheap.
  fuzz:
    name: fuzz / libfuzzer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env: { CC: clang, CXX: clang++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      - name: Build the fuzz harnesses (Clang + libFuzzer)
        run: cmake --preset fuzz && cmake --build --preset fuzz
      - name: Run each harness for a bounded time
        shell: bash
        run: |
          for t in fuzz_json_parser fuzz_cli_parser fuzz_binary_serializer; do
            echo "== $t =="
            ./build/fuzz/"$t" -max_total_time=20 -rss_limit_mb=2048 -print_final_stats=1
          done

  # Line-coverage gate — the library must stay at >= 80% line coverage (roadmap 10.3, ADR-0028).
  coverage:
    name: coverage / line >= 80%
    runs-on: ubuntu-24.04
    env: { CC: gcc, CXX: g++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lukka/get-cmake@f5b8fbb4d77cec1acc5a5f9f0df4beffaf5d98d9 # v4.3.4
      - run: sudo apt-get update && sudo apt-get install -y gcovr
      - name: Build + test with coverage instrumentation
        run: cmake --preset coverage && cmake --build --preset coverage && ctest --preset coverage
      - name: Enforce line coverage >= 80% over src/main/cpp
        run: gcovr --root . --filter 'src/main/cpp/' --print-summary --fail-under-line 80
